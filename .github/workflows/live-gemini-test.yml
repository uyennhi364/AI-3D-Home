name: Live Gemini API Verification

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Lý do kích hoạt kiểm chứng mạng sống Gemini thật'
        required: false
        default: 'Manual Live API Verification'

jobs:
  verify-live-key:
    name: Live Google Gemini Endpoint Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Live Verification Runner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/verify_live_gemini.ts

