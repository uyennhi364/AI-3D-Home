  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Feng Shui Studio — Trợ lý thiết kế phòng ngủ thông minh</title>
    <meta name="description" content="AI Feng Shui Studio — Ứng dụng phân tích phong thủy phòng ngủ Bát Trạch kết hợp mô hình 3D thông minh và Trợ lý AI Interior Designer." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta property="og:title" content="AI Feng Shui Studio" />
    <meta property="og:description" content="AI Feng Shui Studio — Ứng dụng phân tích phong thủy phòng ngủ Bát Trạch kết hợp mô hình 3D thông minh và Trợ lý AI Interior Designer." />

    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <script>
      // Global error logging for console diagnostics without intrusive UI banners
      window.addEventListener('error', function(e) {
        console.warn('[App Error]', e.message || (e.error && e.error.message) || e);
      });

      window.addEventListener('unhandledrejection', function(e) {
        var msg = (e.reason && e.reason.message) || e.reason;
        // Ignore benign Vite HMR dev server reconnects
        if (msg && String(msg).toLowerCase().indexOf('websocket') !== -1) return;
        console.warn('[Unhandled Rejection]', msg);
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
