<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Feng Shui Studio — Trợ lý thiết kế phòng ngủ thông minh</title>
    <meta name="description" content="AI Feng Shui Studio — Ứng dụng phân tích phong thủy phòng ngủ Bát Trạch kết hợp mô hình 3D thông minh và Trợ lý AI Interior Designer." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta property="og:title" content="AI Feng Shui Studio" />
    <meta property="og:description" content="AI Feng Shui Studio — Ứng dụng phân tích phong thủy phòng ngủ Bát Trạch kết hợp mô hình 3D thông minh và Trợ lý AI Interior Designer." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <script>
      function isIgnoredError(msg) {
        if (!msg) return false;
        var s = String(msg).toLowerCase();
        // Ignore benign Vite HMR dev server reconnects and harmless browser notifications
        return (
          s.indexOf('websocket closed without opened') !== -1 ||
          s.indexOf('websocket connection to') !== -1 ||
          s.indexOf('resizeobserver loop') !== -1 ||
          s.indexOf('aborterror') !== -1
        );
      }

      function showErrorBanner(prefix, message, fileInfo) {
        if (isIgnoredError(message)) return;
        console.error(prefix, message, fileInfo);
        var el = document.getElementById('debug-error-box');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-error-box';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#dc2626;color:#ffffff;padding:12px 20px;font-family:sans-serif;font-size:13px;box-shadow:0 10px 25px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:between;gap:12px;';
          var textSpan = document.createElement('div');
          textSpan.id = 'debug-error-text';
          textSpan.style.cssText = 'flex:1;white-space:pre-wrap;word-break:break-word;';
          var closeBtn = document.createElement('button');
          closeBtn.textContent = '✕ Đóng';
          closeBtn.style.cssText = 'background:rgba(255,255,255,0.25);border:none;color:#fff;font-weight:bold;padding:6px 12px;border-radius:6px;cursor:pointer;flex-shrink:0;';
          closeBtn.onclick = function() { el.style.display = 'none'; };
          el.appendChild(textSpan);
          el.appendChild(closeBtn);
          document.body.appendChild(el);
        } else {
          el.style.display = 'flex';
        }
        var textEl = document.getElementById('debug-error-text');
        var fullText = prefix + ' ' + message;
        if (fileInfo) fullText += '\n' + fileInfo;
        if (textEl) textEl.textContent = fullText;
      }

      window.addEventListener('error', function(e) {
        var msg = e.message || (e.error && e.error.message) || e;
        var fileInfo = e.filename ? ('File: ' + e.filename + ' (dòng ' + (e.lineno || '') + ')') : '';
        showErrorBanner('❌ Lỗi JavaScript:', msg, fileInfo);
      });

      window.addEventListener('unhandledrejection', function(e) {
        var msg = (e.reason && e.reason.message) || e.reason;
        showErrorBanner('❌ Lỗi Promise:', msg, '');
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
